name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -storepass androidci \
            -keypass androidci \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI Builder,O=CI,C=US"
          printf '%s\n' \
            'storePassword=androidci' \
            'keyPassword=androidci' \
            'keyAlias=upload' \
            'storeFile=upload-keystore.jks' > android/key.properties

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation
          status=$?
          if [ $status -ne 0 ]; then
            echo "Flutter packaging failed; retrying assembleRelease via Gradle..."
            cd android
            chmod +x gradlew 2>/dev/null || true
            ./gradlew assembleRelease --stacktrace
            status=$?
            cd ..
          fi
          if [ $status -ne 0 ]; then
            exit $status
          fi
          # Normalize APK path for the upload step
          mkdir -p build/app/outputs/flutter-apk
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            found=$(find build -name 'app-release.apk' | head -n 1)
            if [ -n "$found" ]; then
              cp "$found" build/app/outputs/flutter-apk/app-release.apk
            else
              echo "APK not found after build"
              find build -name '*.apk' || true
              exit 1
            fi
          fi
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
