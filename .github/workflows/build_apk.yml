name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -storepass androidci \
            -keypass androidci \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI Builder,O=CI,C=US"
          printf '%s\n' \
            'storePassword=androidci' \
            'keyPassword=androidci' \
            'keyAlias=upload' \
            'storeFile=upload-keystore.jks' > android/key.properties
          echo "key.properties:"
          cat android/key.properties
          ls -la android/app/upload-keystore.jks

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation
          status=$?
          if [ $status -ne 0 ]; then
            echo "::group::Gradle stacktrace"
            cd android
            chmod +x gradlew 2>/dev/null || true
            ./gradlew :app:packageRelease --stacktrace --info 2>&1 | tail -n 250
            echo "::endgroup::"
            exit $status
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
